name: Build Multi-Platform

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build Tauri app
        run: pnpm tauri:build
      
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openMiner-macos-arm64
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app

  build-linux-arm64:
    name: Build Linux ARM64 (Raspberry Pi 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build frontend
        run: pnpm build
      
      - name: Build Tauri app for ARM64
        run: |
          cd apps/desktop/src-tauri
          cargo build --release --target aarch64-unknown-linux-gnu
        env:
          PKG_CONFIG_SYSROOT_DIR: /usr/aarch64-linux-gnu
      
      - name: Create tarball
        run: |
          cd apps/desktop/src-tauri/target/aarch64-unknown-linux-gnu/release
          tar -czf openMiner-pi5-arm64.tar.gz openminedash
      
      - name: Upload Linux ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openMiner-pi5-arm64
          path: apps/desktop/src-tauri/target/aarch64-unknown-linux-gnu/release/openMiner-pi5-arm64.tar.gz

  build-windows:
    name: Build Windows x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      
      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build frontend
        run: pnpm build
      
      - name: Build Tauri app for Windows
        run: |
          cd apps/desktop/src-tauri
          cargo build --release --target x86_64-pc-windows-gnu
      
      - name: Create zip
        run: |
          cd apps/desktop/src-tauri/target/x86_64-pc-windows-gnu/release
          zip openMiner-windows-x64.zip openminedash.exe
      
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openMiner-windows-x64
          path: apps/desktop/src-tauri/target/x86_64-pc-windows-gnu/release/openMiner-windows-x64.zip

  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-linux-arm64, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/openMiner-macos-arm64/**/*
            artifacts/openMiner-pi5-arm64/**/*
            artifacts/openMiner-windows-x64/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
